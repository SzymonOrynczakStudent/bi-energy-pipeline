services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_raw
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-raw_db}
      POSTGRES_USER: ${POSTGRES_USER:-raw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-raw_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raw_user} -d ${POSTGRES_DB:-raw_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: postgres_raw_data
