version: 2

sources:
  - name: istac
    description: "Official Canary Islands Electrical Energy Statistics (ISTAC Operation C00022A)"
    schema: raw
    tables:
      - name: c00022a_000001
        description: "Final electricity consumption and customers (CUPS) by sector (2010-2019)"
        config:
          meta:
            dagster:
              asset_key: ["raw", "c00022a_000001"]
        columns:
          - name: TIME_PERIOD_CODE
            description: "Observation year"
          - name: TERRITORIO_CODE
            description: "NUTS3 territory code"
          - name: FLUJO_ENERGIA_CODE
            description: "Economic sector code"
          - name: OBS_VALUE
            description: "Observed metric value"

      - name: c00022a_000002
        description: "Final electricity consumption and customers (CUPS) by sector (2020-present)"
        config:
          meta:
            dagster:
              asset_key: ["raw", "c00022a_000002"]
        columns:
          - name: TIME_PERIOD_CODE
          - name: TERRITORIO_CODE
          - name: FLUJO_ENERGIA_CODE
          - name: OBS_VALUE

      - name: c00022a_000004
        description: "Electrical balance: gross production, internal demand, and final consumption"
        config:
          meta:
            dagster:
              asset_key: ["raw", "c00022a_000004"]
        columns:
          - name: TIME_PERIOD_CODE
          - name: TERRITORIO_CODE
          - name: MEDIDAS_CODE
          - name: OBS_VALUE

      - name: c00022a_000007
        description: "Net electricity generation by energy source and electrical grid system"
        config:
          meta:
            dagster:
              asset_key: ["raw", "c00022a_000007"]
        columns:
          - name: TIME_PERIOD_CODE
          - name: PRODUCTO_ENERGETICO_CODE
          - name: OBS_VALUE

      - name: c00022a_000008
        description: "Net electricity generation by energy source per island"
        config:
          meta:
            dagster:
              asset_key: ["raw", "c00022a_000008"]
        columns:
          - name: TIME_PERIOD_CODE
          - name: TERRITORIO_CODE
          - name: PRODUCTO_ENERGETICO_CODE
          - name: OBS_VALUE
